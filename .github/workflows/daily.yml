herename: Daily Shorts

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = test, private = test upload, publish = real"
        type: choice
        default: dry
        options: [dry, private, publish, now]
      count:
        description: "How many videos"
        default: "1"

permissions:
  contents: write

concurrency:
  group: daily-shorts

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Make videos
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'publish' }}
          VIDEOS_PER_DAY: ${{ github.event.inputs.count || '5' }}
          NICHE: "mind-blowing facts about space, the ocean, animals and nature"
          VIDEO_LANG: "en"
          PUBLISH_HOURS_UTC: "9,12,15,18,21"
      - name: Save history
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add history.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update history" && git push)
      - name: Keep videos for 2 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/*.mp4
          retention-days: 2
          if-no-files-found: ignore
