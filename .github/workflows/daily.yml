name: Daily Shorts

on:
  schedule:
    - cron: "0 5 * * *"        # every day 05:00 UTC
  workflow_dispatch:           # manual run button
    inputs:
      mode:
        description: "dry = test without upload | private = test upload | publish = real"
        type: choice
        default: dry
        options: [dry, private, publish, now]
      count:
        description: "How many videos"
        default: "1"

permissions:
  contents: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg + fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make and upload videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}   # optional (Pexels paused new keys)
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'publish' }}
          VIDEOS_PER_DAY: ${{ github.event.inputs.count || '5' }}
          # ---- change these to customise the channel ----
          NICHE: "mind-blowing facts about space, the ocean, animals and nature"
          VIDEO_LANG: "en"                 # en or ar
          PUBLISH_HOURS_UTC: "9,12,15,18,21"
        run: python main.py

      - name: Save history (keeps the repo active + avoids repeats)
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add history.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update history" && git push)

      - name: Keep the videos for 2 days (download from phone if needed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/*.mp4
          retention-days: 2
          if-no-files-found: ignore
